<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            transition: all 0.5s ease;
        }

        h1 {
            color: #ff4d6d;
            font-size: 28px;
            margin-bottom: 20px;
        }

        p {
            color: #4a4a4a;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #ff758f;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Reddet butonu için özel stil - Başta normal duracak */
        #btn-reddet {
            background-color: #6c757d;
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.3);
            position: relative;
            z-index: 1000;
        }

        /* Gizli sınıflar */
        .hidden {
            display: none !important;
        }

        .heart-icon {
            font-size: 50px;
            color: #ff4d6d;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ADIM 1: Senden Hoşlanıyorum Ekranı -->
    <div id="step-1" class="card">
        <div class="heart-icon">❤️</div>
        <h1>Senden hoşlanıyorum...</h1>
        <button class="btn" onclick="nextStep()">Sonraki ✨</button>
    </div>

    <!-- ADIM 2: Çıkalım mı Ekranı -->
    <div id="step-2" class="card hidden">
        <div class="heart-icon">🌹</div>
        <h1>Benimle çıkar mısın?</h1>
        <div class="btn-container">
            <button id="btn-kabul" class="btn" onclick="celebrate()">Kabul Et! 😍</button>
            <button id="btn-reddet" class="btn">Hayır 💔</button>
        </div>
    </div>

    <!-- ADIM 3: Tebrikler Ekranı -->
    <div id="step-3" class="card hidden">
        <div class="heart-icon">🥳🎉</div>
        <h1>Süper! ❤️</h1>
        <p>Dünyanın en doğru kararını verdin, pişman olmayacaksın! 😉</p>
    </div>

    <script>
        // Sonraki butonuna basınca 2. adıma geçiş
        function nextStep() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        // Kabul et butonuna basınca tebrik ekranı
        function celebrate() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
            
            // Eğer istersen buraya havai fişek efektleri veya ekstra şeyler de ekleyebilirsin
        }

        const reddetButonu = document.getElementById('btn-reddet');

        // Reddet butonundan kaçış fonksiyonu
        function kac(e) {
            // Butonun konumlandırmasını absolute (serbest) yapıyoruz ki ekranda uçabilsin
            reddetButonu.style.position = 'absolute';
            
            // Ekran genişliği ve yüksekliğinden butonun taşmaması için pay bırakarak rastgele konum seçiyoruz
            const x = Math.random() * (window.innerWidth - reddetButonu.offsetWidth);
            const y = Math.random() * (window.innerHeight - reddetButonu.offsetHeight);
            
            reddetButonu.style.left = `${x}px`;
            reddetButonu.style.top = `${y}px`;
        }

        // Hem masaüstü (mouseover) hem de mobil (touchstart) için kaçma tetikleyicileri
        reddetButonu.addEventListener('mouseover', kac);
        reddetButonu.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Mobil cihazlarda tıklamayı engellemek ve direkt kaçırmak için
            kac();
        });
    </script>
</body>
</html>
